name: AI pull request check

# The AI maintainer (Claude Code, run every few hours by the operator) triages
# issues and opens small fixes on ai/* branches. It never merges. This workflow
# decides: it runs the full test suite on the pull request with no secrets, then
# a plain script (.github/ai-maintainer/gate.sh, always taken from main) merges
# it only if it is small, every test passes, and it touches no protected area.
# See .github/ai-maintainer/PLAYBOOK.md for what the AI is told to do.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: ai-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    if: startsWith(github.head_ref, 'ai/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glasstrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/glasstrack_test
    steps:
      # The pull request's code runs here, so this job has no secrets and can't write anything.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  gate:
    needs: test
    if: always() && startsWith(github.head_ref, 'ai/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The gate script always comes from main, never from the pull request.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/ai-maintainer/gate.sh "${{ github.event.pull_request.number }}" "${{ needs.test.result }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-result
          path: gate-result.md
          if-no-files-found: ignore

  notify:
    needs: [test, gate]
    if: always() && startsWith(github.head_ref, 'ai/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          [[ -z "$TELEGRAM_BOT_TOKEN" ]] && { echo "No Telegram secret set"; exit 0; }
          gate=$(cat gate-result/gate-result.md 2>/dev/null || echo "The merge check did not run.")
          text=$(printf 'Glasstrack AI pull request\n%s\n\n%s\n\n%s' "$PR_TITLE" "$gate" "$PR_URL")
          curl -sS -o /dev/null -w "telegram %{http_code}\n" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}" -d disable_web_page_preview=true
